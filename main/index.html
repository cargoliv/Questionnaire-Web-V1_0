<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Questionnaire</title>
<style>
  :root {
    --bg: #FAFAF7;
    --card: #FFFFFF;
    --ink: #1C2430;
    --ink-soft: #5B6472;
    --border: #DCDCD4;
    --accent: #2F5D62;
    --accent-soft: #E7EFEE;
    --error: #A3432F;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    display: flex;
    justify-content: center;
    padding: 48px 20px;
  }
  .card {
    width: 100%;
    max-width: 540px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 40px 36px;
  }
  h1 {
    font-family: Georgia, "Iowan Old Style", serif;
    font-weight: 400;
    font-size: 26px;
    margin: 0 0 6px;
    line-height: 1.3;
  }
  .subtitle {
    color: var(--ink-soft);
    font-size: 14px;
    margin: 0 0 32px;
    line-height: 1.5;
  }
  .question { margin-bottom: 24px; }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 8px;
  }
  .grid-wrap { overflow-x: auto; }
  .quiz-grid {
    display: grid;
    grid-template-columns: minmax(150px, 1fr) repeat(4, 54px);
    column-gap: 6px;
    row-gap: 20px;
    align-items: center;
    min-width: 460px;
  }
  .grid-header-label {
    font-size: 10px;
    font-weight: 600;
    text-align: center;
    line-height: 1.3;
    color: var(--choice-color);
  }
  .q-label {
    font-size: 14px;
    line-height: 1.4;
    padding-right: 8px;
  }
  .dot-cell { display: flex; justify-content: center; }
  .dot-btn {
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 2px solid var(--choice-color);
    background: var(--card);
    cursor: pointer;
    padding: 0;
  }
  .dot-btn:hover { opacity: 0.8; }
  .dot-btn.selected { background: var(--choice-color); }
  .dot-btn:disabled { opacity: 0.25; cursor: not-allowed; }
  .dot-btn.readonly { cursor: default; pointer-events: none; }
  .dot-btn.readonly:hover { opacity: 1; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 11px 22px;
    font-size: 14px;
    font-weight: 600;
    border-radius: 3px;
    cursor: pointer;
    font-family: inherit;
  }
  button:hover { opacity: 0.92; }
  button.ghost {
    background: none;
    color: var(--ink-soft);
    border: 1px solid var(--border);
    font-weight: 400;
  }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  .footer-link { margin-top: 28px; text-align: center; }
  .footer-link a {
    color: var(--ink-soft);
    font-size: 12px;
    text-decoration: underline;
    cursor: pointer;
  }
  .status {
    margin-top: 16px;
    font-size: 14px;
    padding: 10px 12px;
    border-radius: 3px;
  }
  .status.ok { background: var(--accent-soft); color: var(--accent); }
  .status.err { background: #F6E9E5; color: var(--error); }
  .empty {
    color: var(--ink-soft);
    font-size: 14px;
    text-align: center;
    padding: 20px 0;
  }
  .code-row { display: flex; gap: 8px; margin-top: 10px; }
  .code-row input {
    flex: 1;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 3px;
    font-size: 12px;
    font-family: ui-monospace, monospace;
    color: var(--ink);
    background: var(--card);
  }
  .spinner {
    width: 22px;
    height: 22px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 24px auto;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .center { text-align: center; }
</style>
</head>
<body>

<div class="card" id="app"></div>

<script>
// ---- Modifie tes questions ici ----
const CHOICES = [
  { label: "Oui vraiment", color: "#4A7A5E" },
  { label: "Pourquoi pas", color: "#4B7B9E" },
  { label: "Pas pour le moment", color: "#9B8F7A" },
  { label: "Hors de question", color: "#A3432F" }
];
const QUESTIONS = [
  { id: "q1", label: "Aimerais-tu qu'on invite des amis ce week-end ?" },
  { id: "q2", label: "Est-ce que tu veux m'épouser ?" },
  { id: "q3", label: "On va au ciné ?" },
  { id: "q4", label: "On va se balader ?" },
  { id: "q5", label: "On fait des pâtes ?" },
  { id: "q6", label: "On part en voyage ce week-end ?" },
  { id: "q7", label: "On fait une nuit cinéma canapé ?" },
  { id: "q8", label: "On fait un site internet ?" },
  { id: "q9", label: "On achète un aquarium ?" },
  { id: "q10", label: "On fait un gosse ?" },
  { id: "q11", label: "On invite ta mère ?" },
  { id: "q12", label: "On fait une soirée jeu ?" }
];
// Nombre maximum de fois où chaque réponse peut être choisie au total (absent = illimité)
const LIMITS = { "Oui vraiment": 3, "Pourquoi pas": 3 };
// ------------------------------------

const API = "/api/session";
const app = document.getElementById("app");
let selected = {};
let counts = {};

const params = new URLSearchParams(location.search);
const sessionId = params.get("session");
const role = sessionId ? "B" : "A";

function escapeAttr(str) { return String(str).replace(/"/g, "&quot;"); }
function escapeHtml(str) {
  const div = document.createElement("div");
  div.textContent = str;
  return div.innerHTML;
}

function renderForm() {
  selected = {};
  counts = {};
  app.innerHTML = `
    <h1>Questionnaire</h1>
    <p class="subtitle">${role === "B" ? "Répondez à votre tour, en toute confidentialité." : "Vos réponses seront transmises de façon confidentielle."}</p>
    <div class="grid-wrap"><div class="quiz-grid" id="form-fields"></div></div>
    <button id="submit-btn" style="margin-top:24px;">Envoyer</button>
    <div id="limit-msg"></div>
    <div id="status"></div>
  `;
  const fields = document.getElementById("form-fields");
  fields.innerHTML += `<div></div>` + CHOICES.map(c =>
    `<div class="grid-header-label" style="--choice-color:${c.color}">${c.label}</div>`
  ).join("");

  QUESTIONS.forEach(q => {
    selected[q.id] = CHOICES[2].label;
    fields.innerHTML += `<div class="q-label">${q.label}</div>` + CHOICES.map((c, i) => `
      <div class="dot-cell">
        <button type="button" class="dot-btn${i === 2 ? " selected" : ""}" style="--choice-color:${c.color}" data-qid="${q.id}" data-choice="${escapeAttr(c.label)}"></button>
      </div>
    `).join("");
  });

  fields.querySelectorAll(".dot-btn").forEach(btn => {
    btn.onclick = () => {
      const qid = btn.dataset.qid;
      const newChoice = btn.dataset.choice;
      const prevChoice = selected[qid];
      const limitMsgEl = document.getElementById("limit-msg");
      if (prevChoice === newChoice) return;

      const limit = LIMITS[newChoice];
      if (limit !== undefined && (counts[newChoice] || 0) >= limit) {
        limitMsgEl.className = "status err";
        limitMsgEl.textContent = `Tu as déjà utilisé les ${limit} réponses "${newChoice}" disponibles.`;
        return;
      }
      limitMsgEl.className = "";
      limitMsgEl.textContent = "";

      if (prevChoice && LIMITS[prevChoice] !== undefined) {
        counts[prevChoice] = (counts[prevChoice] || 1) - 1;
      }
      selected[qid] = newChoice;
      if (limit !== undefined) counts[newChoice] = (counts[newChoice] || 0) + 1;

      fields.querySelectorAll(`.dot-btn[data-qid="${qid}"]`).forEach(b => b.classList.remove("selected"));
      btn.classList.add("selected");
      updateDisabledStates();
    };
  });
  document.getElementById("submit-btn").onclick = submitResponse;
}

function updateDisabledStates() {
  document.querySelectorAll(".dot-btn").forEach(btn => {
    const choice = btn.dataset.choice;
    const limit = LIMITS[choice];
    const atLimit = limit !== undefined && (counts[choice] || 0) >= limit;
    btn.disabled = atLimit && !btn.classList.contains("selected");
  });
}

async function submitResponse() {
  const statusEl = document.getElementById("status");
  const submitBtn = document.getElementById("submit-btn");
  const answers = {};
  QUESTIONS.forEach(q => { answers[q.label] = selected[q.id]; });

  submitBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = "";

  try {
    if (role === "A") {
      const res = await fetch(API + "?action=create", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ answers })
      });
      const data = await res.json();
      if (!res.ok || !data.sessionId) throw new Error("create-failed");
      const link = `${location.origin}${location.pathname}?session=${data.sessionId}`;
      renderWaiting(data.sessionId, "A", link);
    } else {
      const res = await fetch(API + "?action=submitB", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ sessionId, answers })
      });
      const data = await res.json();
      if (res.status === 409) {
        statusEl.className = "status err";
        statusEl.textContent = "Ce lien a déjà été utilisé.";
        submitBtn.disabled = true;
        return;
      }
      if (res.status === 404) {
        statusEl.className = "status err";
        statusEl.textContent = "Ce lien n'est plus valide.";
        submitBtn.disabled = true;
        return;
      }
      if (!res.ok) throw new Error("submit-failed");
      renderWaiting(sessionId, "B", null);
    }
  } catch (e) {
    statusEl.className = "status err";
    statusEl.textContent = "L'envoi a échoué. Réessayez.";
    submitBtn.disabled = false;
  }
}

function renderWaiting(sid, myRole, shareLink) {
  app.innerHTML = `
    <h1>Merci !</h1>
    <p class="subtitle">Votre réponse a bien été envoyée.</p>
    ${shareLink ? `
      <div class="question">
        <label>Envoyez ce lien à l'autre personne</label>
        <div class="code-row">
          <input type="text" id="share-link" readonly value="${escapeAttr(shareLink)}">
          <button type="button" id="copy-link-btn" class="ghost">Copier</button>
        </div>
      </div>
    ` : ""}
    <p class="subtitle" style="margin-top:24px;">En attente de la réponse de l'autre personne…</p>
    <div class="spinner"></div>
    <div id="wait-status"></div>
  `;
  if (shareLink) {
    document.getElementById("copy-link-btn").onclick = () => {
      const input = document.getElementById("share-link");
      const btn = document.getElementById("copy-link-btn");
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(shareLink).then(() => {
          btn.textContent = "Copié !";
          setTimeout(() => { btn.textContent = "Copier"; }, 1500);
        }).catch(() => input.select());
      } else {
        input.select();
      }
    };
  }
  pollStatus(sid, myRole);
}

async function pollStatus(sid, myRole) {
  try {
    const res = await fetch(`${API}?action=status&sessionId=${encodeURIComponent(sid)}&role=${myRole}`);
    const data = await res.json();
    if (res.status === 404) {
      document.getElementById("wait-status").innerHTML = `<div class="status err">Cette session n'existe plus.</div>`;
      return;
    }
    if (!res.ok) throw new Error("status-failed");
    if (!data.ready) {
      setTimeout(() => pollStatus(sid, myRole), 3000);
      return;
    }
    if (data.alreadyViewed) {
      renderAlreadyViewed();
      return;
    }
    renderResult(data.common || []);
  } catch (e) {
    setTimeout(() => pollStatus(sid, myRole), 4000);
  }
}

function renderAlreadyViewed() {
  app.innerHTML = `
    <h1>Déjà consulté</h1>
    <p class="subtitle">Cette page de résultat n'est accessible qu'une seule fois, et elle a déjà été consultée.</p>
  `;
}

function renderResult(common) {
  let bodyHtml;
  if (common.length === 0) {
    bodyHtml = `<p class="empty">Aucune réponse commune.</p>`;
  } else {
    bodyHtml = `<div class="grid-wrap"><div class="quiz-grid">` +
      `<div></div>` + CHOICES.map(c =>
        `<div class="grid-header-label" style="--choice-color:${c.color}">${c.label}</div>`
      ).join("") +
      common.map(item => {
        return `<div class="q-label">${escapeHtml(item.question)}</div>` + CHOICES.map(c => `
          <div class="dot-cell">
            <button type="button" class="dot-btn readonly${c.label === item.answer ? " selected" : ""}" style="--choice-color:${c.color}" disabled></button>
          </div>
        `).join("");
      }).join("") +
      `</div></div>`;
  }
  app.innerHTML = `
    <h1>Vos points communs</h1>
    <p class="subtitle">Ce résultat n'est visible qu'une seule fois.</p>
    ${bodyHtml}
  `;
}

// ---- Démarrage ----
if (role === "B" && !sessionId) {
  app.innerHTML = `<h1>Lien invalide</h1><p class="subtitle">Ce lien de questionnaire n'est pas valide.</p>`;
} else {
  renderForm();
}
</script>

</body>
</html>
